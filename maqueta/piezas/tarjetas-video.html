<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarjetas de video · Pieza · Maqueta Estud-IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/secciones.css">
</head>
<body>
  <main class="pieza-lienzo">
    <div class="fila-piezas" style="padding-block-end: 12px">
      <article id="tarjeta-vivo" role="group" aria-label="tarjeta-vivo" class="pieza tarjeta-video" style="--tv-ancho: 220px; --tv-avatar: 60px">
        <div class="tarjeta-video-marco escena" data-escena="fisica">
          <span class="escena-motivo" style="inset: 18% auto auto 10%; font-size: 4rem" aria-hidden="true">λ</span>
          <span class="etiqueta" data-tipo="vivo"><span class="punto-vivo" aria-hidden="true"></span>En vivo</span>
          <div class="tarjeta-video-info"><h3 style="font-size: 1.1rem">Física: ondas y partículas</h3><div class="tarjeta-video-datos"><span><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#eye"/></svg>1,2 k viendo</span></div></div>
        </div>
        <span class="avatar" data-color="menta" data-vivo>PV</span>
      </article>
      <article id="tarjeta-short" role="group" aria-label="tarjeta-short" class="pieza tarjeta-video" style="--tv-ancho: 220px; --tv-avatar: 60px">
        <div class="tarjeta-video-marco escena" data-escena="programacion">
          <span class="escena-motivo" style="inset: 18% auto auto 10%; font-size: 4rem" aria-hidden="true">&lt;/&gt;</span>
          <span class="etiqueta" data-tipo="short">Short</span>
          <div class="tarjeta-video-info"><h3 style="font-size: 1.1rem">Python en 60 segundos: listas</h3><div class="tarjeta-video-datos"><span><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#heart"/></svg>842</span><span><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#message-circle"/></svg>36</span></div></div>
        </div>
        <span class="avatar" data-color="amarillo">DR</span>
      </article>
      <article id="tarjeta-grabacion" role="group" aria-label="tarjeta-grabacion" class="pieza tarjeta-video" style="--tv-ancho: 220px; --tv-avatar: 60px">
        <div class="tarjeta-video-marco escena" data-escena="mates">
          <span class="escena-motivo" style="inset: 18% auto auto 10%; font-size: 4rem" aria-hidden="true">∫ x²</span>
          <span class="etiqueta" data-tipo="grabacion">Grabación</span>
          <div class="tarjeta-video-info"><h3 style="font-size: 1.1rem">Cálculo: integrales sin miedo</h3><div class="tarjeta-video-datos"><span><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#clock"/></svg>58 min</span></div></div>
        </div>
        <span class="avatar" data-color="lavanda">LM</span>
      </article>
    </div>
  </main>
</body>
</html>
