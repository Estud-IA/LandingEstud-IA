<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasos de instalación · Pieza · Maqueta Estud-IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/secciones.css">
</head>
<body>
  <main class="pieza-lienzo">
    <div class="fila-piezas" style="align-items: start">
      <section id="paso-1" aria-label="paso-1" class="pieza instalacion-pantalla">
        <span class="etiqueta" data-tipo="short" style="justify-self: start; font-size: 1rem">Paso 1</span>
        <div class="notificacion resaltado">
          <img src="../assets/app-icon.png" alt="" width="44" height="44">
          <div><strong>estud-ia-1.0.0.apk</strong><small>Descarga completa · 48 MB</small></div>
          <span style="margin-inline-start: auto; font-weight: 600; color: var(--ilus-indigo)">Abrir</span>
        </div>
      </section>
      <section id="paso-2" aria-label="paso-2" class="pieza instalacion-pantalla">
        <span class="etiqueta" data-tipo="short" style="justify-self: start; font-size: 1rem">Paso 2</span>
        <div class="dialogo">
          <h2>Instalar apps desconocidas</h2>
          <p>Por seguridad, tu teléfono no puede instalar apps desconocidas de esta fuente.</p>
          <div class="acciones"><span>Cancelar</span><span>Configuración</span></div>
        </div>
        <div class="interruptor resaltado"><span>Permitir de esta fuente</span><span aria-hidden="true"></span></div>
      </section>
      <section id="paso-3" aria-label="paso-3" class="pieza instalacion-pantalla">
        <span class="etiqueta" data-tipo="short" style="justify-self: start; font-size: 1rem">Paso 3</span>
        <div class="dialogo" style="justify-items: center; text-align: center">
          <img src="../assets/app-icon.png" alt="" width="72" height="72" style="border-radius: 18px">
          <h2>Estud-IA</h2>
          <p>¿Quieres instalar esta app?</p>
          <div class="acciones" style="justify-content: center"><span>Cancelar</span><span class="resaltado" style="padding: 4px 10px">Instalar</span></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
