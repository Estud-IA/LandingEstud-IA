<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>Shorts · Pantalla · Maqueta Estud-IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/pantallas.css">
</head>
<body>
  <div class="app" data-tema="oscuro">
    <div class="directo escena" data-escena="programacion" aria-hidden="true">
      <span class="escena-motivo" style="inset: 22% auto auto 8%; font-size: 4.2rem; color: color-mix(in srgb, var(--gris-50) 70%, transparent)">[x*2<br>for x<br>in nums]</span>
      <div class="directo-velo"></div>
    </div>
    <div class="barra-estado"><span>9:41</span><span class="estado-iconos" aria-hidden="true"><span class="senal"></span><span class="bateria"></span></span></div>
    <div style="position: relative; z-index: 2; padding: 4px 16px"><span class="etiqueta" data-tipo="short">Short</span></div>
    <div class="short-acciones">
      <div><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#heart"/></svg>842</div>
      <div><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#message-circle"/></svg>36</div>
      <div><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#share-2"/></svg>Compartir</div>
      <div><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#more-vertical"/></svg></div>
    </div>
    <div class="short-info">
      <div class="short-autor"><span class="avatar" style="--tam: 40px">DR</span>@diego.ruiz <span class="btn" data-tamano="chico" style="font-size: 12px">Seguir</span></div>
      <p>Python en 60 segundos: listas por comprensión. ¿Lo sabías?</p>
      <div class="barra-xp" style="--progreso: 40%; block-size: 6px; border-width: 0"><span style="border: 0"></span></div>
    </div>
    <div style="flex: 1"></div>
    <nav class="nav-app" aria-label="Navegación de la app">
      <span role="img" aria-label="Inicio"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#home"/></svg></span>
      <span role="img" aria-label="Shorts" aria-current="page"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#play"/></svg></span>
      <span class="boton-mas" role="img" aria-label="Crear"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#plus"/></svg></span>
      <span role="img" aria-label="Cursos"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#book-open"/></svg></span>
      <span role="img" aria-label="Perfil"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#user"/></svg></span>
    </nav>
  </div>
</body>
</html>
