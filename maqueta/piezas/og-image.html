<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imagen para compartir · Pieza · Maqueta Estud-IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/secciones.css">
</head>
<body>
  <main class="pieza-lienzo">
    <section id="og-image" class="pieza og" aria-label="og-image">
      <div class="og-texto">
        <span class="marca" style="font-size: 1.9rem"><img src="../assets/logo.svg" alt="" width="48" height="51">Estud-IA</span>
        <p class="titulo-display"><span>Aprende en vivo.</span><span>Sube de nivel.</span></p>
        <p class="texto-apoyo" style="font-size: 1.6rem">Clases en directo, chat al instante y XP por participar.</p>
        <span class="btn" data-tono="esmeralda" data-tamano="grande"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#download"/></svg>Descarga gratis para Android</span>
      </div>
      <div class="telefono">
        <iframe src="../pantallas/directo-chat.html" title="Clase en vivo" tabindex="-1"></iframe>
      </div>
      <span class="etiqueta flotante" data-tipo="vivo" style="inset: 64px 300px auto auto; --giro: -6deg; font-size: 1.3rem"><span class="punto-vivo" aria-hidden="true"></span>En vivo</span>
      <span class="chip-xp flotante" style="inset: auto 330px 90px auto; --giro: -5deg; font-size: 1.5rem"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#zap"/></svg>+10 XP</span>
      <span class="boton-mas forma-mas" style="inset: 40px 40px auto auto; --giro: 14deg" aria-hidden="true"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#plus"/></svg></span>
    </section>
  </main>
</body>
</html>
