<!doctype html>
<html lang="es">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../css/tokens.css">

  <div class="app" data-tema="oscuro">

    <div class="estudio-vista escena" data-escena="quimica">

    <div class="estudio-controles">

    </div>
    <div class="estudio-abajo">
      <span class="campo"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#edit-2"/></svg>Química orgánica · Clase 1</span>
      <span class="boton-transmitir" role="img" aria-label="Iniciar transmisión"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#radio"/></svg></span>
    </div>
  </div>
