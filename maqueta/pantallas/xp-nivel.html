<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>Subida de nivel · Pantalla · Maqueta Estud-IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/pantallas.css">
</head>
<body>
  <div class="app" data-tema="oscuro">
    <div class="directo escena" data-escena="fisica" aria-hidden="true">
      <span class="escena-motivo" style="inset: auto auto 20% -4%; font-size: 9rem">λ</span>
      <div class="directo-pizarra">
        <span>Dualidad onda-partícula</span>
        <strong>λ = h / p</strong>
        <svg viewBox="0 0 300 60" preserveAspectRatio="none"><path d="M0 30 Q 18.75 0 37.5 30 T 75 30 T 112.5 30 T 150 30 T 187.5 30 T 225 30 T 262.5 30 T 300 30"/></svg>
      </div>
      <div class="directo-velo"></div>
    </div>
    <div class="barra-estado"><span>9:41</span><span class="estado-iconos" aria-hidden="true"><span class="senal"></span><span class="bateria"></span></span></div>
    <div class="directo-cabecera">
      <span class="boton-icono"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#arrow-left"/></svg></span>
      <div class="directo-titulo">
        <h1>Física: ondas y partículas</h1>
        <p>Clase 3 · Profe Valeria</p>
      </div>
      <div class="directo-estado">
        <span class="etiqueta" data-tipo="vivo" style="font-size: 0.85rem"><span class="punto-vivo" aria-hidden="true"></span>En vivo</span>
        <span class="pildora-dato"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#eye"/></svg>1,2 k</span>
      </div>
    </div>
    <div class="confeti" aria-hidden="true">
      <i style="inset: 210px auto auto 40px; --c: var(--color-acento); --r: -25deg"></i>
      <i style="inset: 180px auto auto 120px; --r: 15deg"></i>
      <i style="inset: 200px 60px auto auto; --c: var(--ilus-coral); --r: 40deg"></i>
      <i style="inset: 250px 120px auto auto; --c: var(--lavanda-100); --r: -10deg"></i>
      <i style="inset: 240px auto auto 200px; --c: var(--color-acento); --r: 60deg"></i>
    </div>
    <section class="panel-flotante" style="inset-block-end: 110px; justify-items: center; text-align: center" aria-label="Subiste de nivel">
      <span class="insignia-nivel" style="font-size: 30px; margin-block-start: -64px">
        <small>NIVEL</small><strong>12</strong>
      </span>
      <h2 style="font-size: 28px; font-weight: 800">¡Subiste de nivel!</h2>
      <div style="inline-size: 100%; display: grid; gap: 6px">
        <div class="barra-xp" style="--progreso: 18%"><span></span></div>
        <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--color-texto-suave)"><span>270 / 1.500 XP</span><span>Nivel 13</span></div>
      </div>
      <ul class="opciones" style="inline-size: 100%; text-align: start">
        <li><span class="letra"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#eye"/></svg></span>Asististe a la clase<span class="porcentaje">+10 XP</span></li>
        <li><span class="letra"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#check"/></svg></span>Trivia correcta<span class="porcentaje">+15 XP</span></li>
        <li><span class="letra"><svg class="icono" aria-hidden="true"><use href="../assets/iconos/sprite.svg#zap"/></svg></span>Racha de 7 días<span class="porcentaje">+25 XP</span></li>
      </ul>
      <span class="btn" data-tono="esmeralda" style="inline-size: 100%">Seguir viendo</span>
    </section>
  </div>
</body>
</html>
